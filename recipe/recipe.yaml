context:
  version: "1.0.2"
  python_min: "3.12"

package:
  name: mvlogics
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/mvlogics/mvlogics-${{ version }}.tar.gz
  sha256: d5eb692fa9e9a56ed8c1c0563fb994d5588851900f5b37e239bd67492710909d

build:
  script:
    - uv pip install --python ${{ PYTHON }} --no-deps -vv .
  number: 0
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - uv
  run:
    - python >=${{ python_min }}

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - mvlogics
      pip_check: true

about:
  homepage: https://github.com/jonathandung/mvlogics
  summary: 'Structured and well-equipped collection of unconventional systems logics with more than two truth values.'
  license: MIT
  license_file: LICENSE
  repository: https://github.com/jonathandung/mvlogics

extra:
  recipe-maintainers:
    - jonathandung
